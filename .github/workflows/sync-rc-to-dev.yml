name: Sync RC to Dev

on:
  # Triggered after an RC tag is created
  push:
    tags:
      - '*-rc.*'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      rc_branch:
        description: 'RC branch to sync from (e.g., rc/0.9.0)'
        required: true
        type: string

jobs:
  sync-rc-to-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use a token with PR creation permissions
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine RC branch
        id: get-rc-branch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RC_BRANCH="${{ github.event.inputs.rc_branch }}"
          else
            # Extract version from tag (e.g., 0.9.0-rc.1 -> 0.9.0)
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION=$(echo "$TAG" | sed -E 's/-rc\.[0-9]+$//')
            RC_BRANCH="rc/$VERSION"
          fi
          echo "rc_branch=$RC_BRANCH" >> $GITHUB_OUTPUT

      - name: Check if sync is needed
        id: check-sync
        run: |
          git fetch origin dev "${{ steps.get-rc-branch.outputs.rc_branch }}"

          # Check if there are commits in rc that aren't in dev
          COMMITS_AHEAD=$(git rev-list --count origin/dev..origin/${{ steps.get-rc-branch.outputs.rc_branch }})

          if [ "$COMMITS_AHEAD" -eq 0 ]; then
            echo "No commits to sync from ${{ steps.get-rc-branch.outputs.rc_branch }} to dev"
            echo "needs_sync=false" >> $GITHUB_OUTPUT
          else
            echo "$COMMITS_AHEAD commits ahead - sync needed"
            echo "needs_sync=true" >> $GITHUB_OUTPUT
          fi

      - name: Create sync PR
        if: steps.check-sync.outputs.needs_sync == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const rcBranch = '${{ steps.get-rc-branch.outputs.rc_branch }}';
            const tag = process.env.GITHUB_REF?.replace('refs/tags/', '') || 'manual sync';

            // Find and close any existing sync PRs for this RC branch (superseded by the new one)
            const existingPRs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${rcBranch}`,
              base: 'dev'
            });

            for (const oldPR of existingPRs.data) {
              console.log(`Closing superseded sync PR #${oldPR.number}`);

              // Add a comment explaining why it's being closed
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: oldPR.number,
                body: `Closing this PR as it has been superseded by a newer RC tag: \`${tag}\`.\n\nA new sync PR will be created with all the latest changes.`
              });

              // Close the old PR
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: oldPR.number,
                state: 'closed'
              });
            }

            // Create the new PR
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Sync ${rcBranch} to dev`,
              body: `## Automated RC Sync

            This PR syncs changes from \`${rcBranch}\` back to \`dev\` to prevent branch deviation.

            **Triggered by:** ${tag}

            ### Review Notes
            - Please review any hotfix changes that were applied directly to the RC branch
            - Resolve any merge conflicts that may arise
            - This helps ensure dev stays up-to-date with release fixes

            ---
            *This PR was automatically created by the sync-rc-to-dev workflow.*`,
              head: rcBranch,
              base: 'dev'
            });

            console.log(`Created PR #${pr.data.number}: ${pr.data.html_url}`);

name: Auto RC Tag

on:
  pull_request:
    types: [closed]
    branches:
      - 'rc/*'

jobs:
  auto-tag-rc:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tagger.outputs.TAG }}
      rc_branch: ${{ steps.tagger.outputs.RC_BRANCH }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get next RC tag
        id: tagger
        run: |
          # Use base ref (the target branch) since github.ref points to refs/pull/*/merge during PR events
          RC_BRANCH="${{ github.event.pull_request.base.ref }}"
          VERSION=$(echo "$RC_BRANCH" | sed -E 's#rc/##')
          PREFIX="$VERSION-rc"

          echo "Looking for previous tags matching $PREFIX.*"
          git fetch --tags

          LATEST=$(git tag -l "$PREFIX.*" | sed -E "s/.*rc\.//" | sort -n | tail -1)
          NEXT=$((LATEST + 1))
          TAG="$PREFIX.$NEXT"

          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "RC_BRANCH=$RC_BRANCH" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git tag ${{ steps.tagger.outputs.TAG }}
          git push origin ${{ steps.tagger.outputs.TAG }}

  create-prerelease:
    needs: auto-tag-rc
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        run: |
          TAG="${{ needs.auto-tag-rc.outputs.tag }}"
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            git log --pretty=format:"* %s" > CHANGELOG.md
          else
            git log --pretty=format:"* %s" $PREVIOUS_TAG..HEAD > CHANGELOG.md
          fi

      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.auto-tag-rc.outputs.tag }}
          files: CHANGELOG.md
          body_path: CHANGELOG.md
          draft: false
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}

  sync-rc-to-dev:
    needs: auto-tag-rc
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if sync is needed
        id: check-sync
        run: |
          RC_BRANCH="${{ needs.auto-tag-rc.outputs.rc_branch }}"
          git fetch origin dev "$RC_BRANCH"

          # Check if there are commits in rc that aren't in dev
          COMMITS_AHEAD=$(git rev-list --count origin/dev..origin/$RC_BRANCH)

          if [ "$COMMITS_AHEAD" -eq 0 ]; then
            echo "No commits to sync from $RC_BRANCH to dev"
            echo "needs_sync=false" >> $GITHUB_OUTPUT
          else
            echo "$COMMITS_AHEAD commits ahead - sync needed"
            echo "needs_sync=true" >> $GITHUB_OUTPUT
          fi

      - name: Create or update sync PR
        if: steps.check-sync.outputs.needs_sync == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const rcBranch = '${{ needs.auto-tag-rc.outputs.rc_branch }}';
            const tag = '${{ needs.auto-tag-rc.outputs.tag }}';

            // Check if a sync PR already exists for this RC branch
            const existingPRs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${rcBranch}`,
              base: 'dev'
            });

            if (existingPRs.data.length > 0) {
              const existingPR = existingPRs.data[0];
              console.log(`Sync PR already exists: #${existingPR.number} - ${existingPR.html_url}`);

              // Add a comment noting the new RC tag
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingPR.number,
                body: `🏷️ New RC tag created: \`${tag}\`\n\nThis PR now includes changes up to this release candidate.`
              });

              console.log(`Added comment to PR #${existingPR.number} for tag ${tag}`);
              return;
            }

            // Create new sync PR
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Sync ${rcBranch} to dev`,
              body: `## Automated RC Sync

            This PR syncs changes from \`${rcBranch}\` back to \`dev\` to prevent branch deviation.

            **Initially triggered by:** ${tag}

            ### Review Notes
            - This PR automatically stays up-to-date as new commits land on \`${rcBranch}\`
            - Please review any hotfix changes that were applied directly to the RC branch
            - Resolve any merge conflicts that may arise
            - Merge this after the RC is finalized or periodically to keep dev in sync

            ---
            *This PR was automatically created by the sync-rc-to-dev workflow.*`,
              head: rcBranch,
              base: 'dev'
            });

            console.log(`Created PR #${pr.data.number}: ${pr.data.html_url}`);

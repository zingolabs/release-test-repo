name: RC Branch Created

on:
  create:

jobs:
  setup-release:
    # Only run for rc/* branches
    if: github.ref_type == 'branch' && startsWith(github.ref_name, 'rc/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Ensure labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'release', color: '28a745', description: 'Release PR from RC to stable' },
              { name: 'sync', color: '0366d6', description: 'Sync PR from RC back to dev' },
              { name: 'hotfix', color: 'd93f0b', description: 'Hotfix PR targeting RC branch' },
              { name: 'automated', color: '6c757d', description: 'PR created by CI automation' }
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
                console.log(`Created label: ${label.name}`);
              } catch (e) {
                if (e.status === 422) {
                  console.log(`Label already exists: ${label.name}`);
                } else {
                  throw e;
                }
              }
            }

      - name: Create release PR
        uses: actions/github-script@v7
        with:
          script: |
            const rcBranch = '${{ github.ref_name }}';
            const version = rcBranch.replace(/^rc\//, '');

            // Check if release PR already exists
            const existingPRs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${rcBranch}`,
              base: 'stable'
            });

            if (existingPRs.data.length > 0) {
              console.log(`Release PR already exists: #${existingPRs.data[0].number}`);
              return;
            }

            // Create release PR
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Release ${version}`,
              body: `## Release ${version}

            This PR will release version \`${version}\` when merged to stable.

            ### Checklist
            - [ ] All hotfixes have been applied and tested
            - [ ] RC has been validated
            - [ ] Ready for release

            ---
            *This PR was automatically created when the \`${rcBranch}\` branch was pushed.*`,
              head: rcBranch,
              base: 'stable'
            });

            // Add labels
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.data.number,
              labels: ['release', 'automated']
            });

            console.log(`Created release PR #${pr.data.number}: ${pr.data.html_url}`);
